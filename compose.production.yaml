name: rss-lambda
services:
  rss-lambda:
    image: ghcr.io/sekai-soft/rss-lambda:latest
    container_name: rss-lambda
    restart: unless-stopped
    env_file:
      - env
    depends_on:
      rss-lambda-ts:
        condition: service_healthy
    network_mode: service:rss-lambda-ts
  rss-lambda-ts:
    image: tailscale/tailscale:latest
    container_name: rss-lambda-ts
    restart: unless-stopped
    hostname: rss-lambda
    command:
      - /bin/sh
      - -c
      - |
        echo "[ts] waiting for tailscale control-plane reachability..."
        until nc -z -w 2 api.tailscale.com 443 >/dev/null 2>&1 && nc -z -w 2 controlplane.tailscale.com 443 >/dev/null 2>&1; do
          sleep 2
        done
        echo "[ts] control-plane reachable, starting containerboot"
        exec /usr/local/bin/containerboot
    environment:
      - TS_EXTRA_ARGS=--advertise-tags=tag:server
      - TS_STATE_DIR=/var/lib/tailscale
    healthcheck:
      test: ["CMD-SHELL", "tailscale status --json | grep -Eq '\"BackendState\": *\"Running\"'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    env_file:
      - $HOME/env-tailscale
    volumes:
      - rss-lambda-ts:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
      - sys_module
    labels:
      - com.centurylinklabs.watchtower.enable=true

volumes:
  rss-lambda-ts:
